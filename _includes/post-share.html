<div class="post-share">
  <span>{{ site.data.settings.sharing_button_prompt }}</span>
  <div class="sharing-icons">
    <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&amp;url={{ site.url }}{{ page.url }}"
       target="_blank" rel="noopener" aria-label="X(Twitter)에 공유">
      <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
    </a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}"
       target="_blank" rel="noopener" aria-label="Facebook에 공유">
      <i class="fa-brands fa-facebook" aria-hidden="true"></i>
    </a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}"
       target="_blank" rel="noopener" aria-label="LinkedIn에 공유">
      <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
    </a>
    <button type="button" class="copy-link" data-url="{{ site.url }}{{ page.url }}" aria-label="링크 복사">
      <i class="fa-solid fa-link" aria-hidden="true"></i>
    </button>
  </div>
</div>

<script>
  (function () {
    var btn = document.querySelector('.copy-link');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var url = btn.getAttribute('data-url');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          var icon = btn.querySelector('i');
          if (!icon) return;
          var old = icon.className;
          icon.className = 'fa-solid fa-check';
          setTimeout(function () { icon.className = old; }, 1200);
        });
      }
    });
  })();
</script>
