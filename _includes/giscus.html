{% if site.data.settings.giscus and site.data.settings.giscus.repo_id and site.data.settings.giscus.repo_id != '' %}
<div class="giscus" style="margin-top: var(--space-6);"></div>
<script src="https://giscus.app/client.js"
        data-repo="{{ site.data.settings.giscus.repo }}"
        data-repo-id="{{ site.data.settings.giscus.repo_id }}"
        data-category="{{ site.data.settings.giscus.category | default: 'General' }}"
        data-category-id="{{ site.data.settings.giscus.category_id }}"
        data-mapping="{{ site.data.settings.giscus.mapping | default: 'pathname' }}"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="{{ site.data.settings.giscus.theme | default: 'preferred_color_scheme' }}"
        data-lang="ko"
        crossorigin="anonymous"
        async>
</script>
{% endif %}
