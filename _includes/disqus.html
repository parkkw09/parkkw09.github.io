{% if site.data.settings.disqus.comments %}
<div id="disqus_thread" style="margin-top: var(--space-6);"></div>
<script>
  (function() {
    var d = document, s = d.createElement('script');
    s.src = 'https://{{ site.data.settings.disqus.disqus_shortname }}.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  })();
</script>
<noscript>댓글을 보시려면 JavaScript를 활성화해주세요. <a href="https://disqus.com/?ref_noscript">Disqus로 이동</a></noscript>
{% endif %}
